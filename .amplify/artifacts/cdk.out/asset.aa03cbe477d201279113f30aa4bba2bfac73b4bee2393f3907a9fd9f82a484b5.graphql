type Query @aws_iam {
  getFacilityOptions: AWSJSON @aws_iam
  createCustomerQuote: AWSJSON @aws_iam
  calculatePackageOptions(quoteID: String): AWSJSON @aws_iam
  updateQuoteBudget(quoteID: String, budget: Float): AWSJSON @aws_iam
  updateCustomerInfo(quoteID: String, customerInfo: AWSJSON): AWSJSON @aws_iam
  updateFacilityType(quoteID: String, facilityType: String): AWSJSON @aws_iam
  updateFloorInfo(quoteID: String, floorInfo: AWSJSON): AWSJSON @aws_iam
  confirmQuote(quoteID: String): AWSJSON @aws_iam
  getQuote(quoteID: String): AWSJSON @aws_iam
  updateQuoteRooms(quoteID: String, formInfo: AWSJSON): AWSJSON @aws_iam
  updatePackageChoice(quoteID: String, packageInfo: AWSJSON): AWSJSON @aws_iam
  sendQuoteConfirmationEmail(quoteID: String): AWSJSON @aws_iam
}

